name: chess_arena
description: "Chess Arena - play vs CPU (ELO-scaled), puzzles, rankings. Local-first with Hive, Supabase-ready."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ">=6.0.0 <7.0.0"
  hive: ">=2.2.0 <3.0.0"
  hive_flutter: ">=1.1.0 <2.0.0"
  audioplayers: ">=5.2.0 <7.0.0"
  supabase_flutter: ">=2.17.0 <3.0.0" # publishableKey (anonKey deprecated)
  chess_vectors_flutter: ">=1.1.0 <2.0.0"
  chess_interface: ">=1.2.1 <2.0.0"   # bundled fillable piece PNGs (modern_minimalist)
  random_avatar: ">=0.0.8 <1.0.0"     # offline Multiavatar identicons
  country_pickers: ">=3.0.1 <4.0.0"   # real flag picker dialog
  stockfish: ">=1.8.1 <2.0.0"         # native engine (Android/iOS) via FFI
  random_name_generator: ">=1.5.0 <2.0.0" # localized human names per zone
  eliza_chat: ">=1.0.1 <2.0.0"        # offline ELIZA conversational brain
  # Standalone ML Kit Smart Reply (NOT the monolithic google_ml_kit,
  # which bloats 100 MB+). Contextual on-device replies, Android/iOS only.
  google_mlkit_smart_reply: ">=0.15.1 <1.0.0"
  flutter_svg: ">=2.0.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
    - assets/img/
