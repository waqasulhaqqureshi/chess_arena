name: chess_arena
description: "Chess Arena - play vs CPU (ELO-scaled), puzzles, rankings. Local-first with Hive, Supabase-ready."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ">=6.0.0 <7.0.0"
  hive: ">=2.2.0 <3.0.0"
  hive_flutter: ">=1.1.0 <2.0.0"
  audioplayers: ">=5.2.0 <7.0.0"
  supabase_flutter: ">=2.0.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
